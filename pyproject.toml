[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-color-inverter"
version = "0.1.0"
description = "High-resolution PDF color inverter with optional one-sided threshold flattening."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Mark Fazekas" }]
dependencies = ["numpy==2.3.5", "PyMuPDF==1.26.7", "pydantic==2.13.4"]

[project.scripts]
pdf-color-inverter = "pdf_color_inverter.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_reexport = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pymupdf"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["ALL"]
external = ["WPS"]
ignore = ["COM812", "CPY001", "D104", "D203", "D213", "E501", "N818", "S101"]
fixable = ["I", "TC"]
unfixable = ["B"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"src/pdf_color_inverter/models.py" = ["TC003"]
"tests/**/*.py" = ["SLF001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
