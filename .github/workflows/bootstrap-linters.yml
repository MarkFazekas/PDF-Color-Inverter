name: Bootstrap linters

on:
  push:
    branches:
      - tooling-bootstrap

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install development dependencies
        run: |
          python -m venv .lint-venv
          .lint-venv/bin/python -m pip install -e ".[dev]"
      - name: Pack linter runtime
        run: |
          tar -C .lint-venv -czf lint-runtime.tar.gz lib/python3.13/site-packages bin/ruff
      - uses: actions/upload-artifact@v4
        with:
          name: lint-runtime
          path: lint-runtime.tar.gz
          if-no-files-found: error
